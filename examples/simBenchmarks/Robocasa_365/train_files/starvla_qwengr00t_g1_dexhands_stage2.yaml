run_id: starvla_qwengr00t_g1_dexhands_fridge_pick_grapes_stage2
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null  # infer from the authenticated W&B account
wandb_project: starVLA_unitree_g1_dexhands
is_debug: false
version_id: "0.21"

# Unitree G1 whole-body + dexterous hands, trained with a Qwen3-VL backbone
# and a GR00T-style flow-matching DiT action head.
# State is 81D after excluding the 3D commanded waist field from observation;
# action is 45D absolute joint position and the 16-frame horizon is 0.32 s at 50 Hz.
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2560
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 45
    state_dim: 81
    action_horizon: 16
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets
    data_mix: g1_fridge_pick_grapes_train
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    # One H200 NVL (144 GB): maximize real samples per optimizer step.
    # The DiT head sees 16 * 4 = 64 noisy trajectories internally.
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    # Input order is front_view, left_wrist_view, right_wrist_view. Split the
    # stereo front frame into head-left/head-right and preserve every view's
    # aspect ratio with padding. The model therefore receives four views.
    split_side_by_side_indices: [0]
    letterbox_images: true
    delete_pause_frame: false
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: false
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

trainer:
  # Continue from the highest valid steps_* checkpoint in this run directory.
  is_resume: false
  pretrained_checkpoint: results/Checkpoints/starvla_qwengr00t_g1_dexhands_fridge_pick_grapes/final_model/pytorch_model.pt
  # Full end-to-end fine-tuning from the pretrained Qwen3-VL backbone.
  max_train_steps: 40000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 10000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
