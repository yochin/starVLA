run_id: starvla_qwenoft_g1_dexhands_fridge_pick_grapes_stage2
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null  # infer from the authenticated W&B account
wandb_project: starVLA_unitree_g1_dexhands
is_debug: false
version_id: "0.21"

# Unitree G1 whole-body + dexterous hands, QwenOFT Stage 2 (Fine-Tuning +80k steps):
# Initialized from Stage 1 80k checkpoint: results/Checkpoints/starvla_qwenoft_g1_dexhands_fridge_pick_grapes/final_model/pytorch_model.pt
# - No proprioceptive state input (language + image only).
# - Loss masking on head 2D (dims 0, 1) and hand discrete mode selectors (dims 10, 36).
# - 80,000 steps with fine-tuning learning rate (base: 5.0e-6, action_model: 5.0e-5).
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 45
    state_dim: 0
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    # Exclude head (0, 1) and hand discrete mode selectors (10, 36) from L1 regression loss
    ignored_action_dims: [0, 1, 10, 36]

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets
    data_mix: g1_fridge_pick_grapes_train
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    # One H200 NVL (144 GB): maximize real samples per optimizer step.
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    # Input order is front_view, left_wrist_view, right_wrist_view. Split the
    # stereo front frame into head-left/head-right and preserve every view's
    # aspect ratio with padding. The model therefore receives four views.
    split_side_by_side_indices: [0]
    letterbox_images: true
    delete_pause_frame: false
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: false
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

trainer:
  is_resume: false
  # Continue fine-tuning from Stage 1 checkpoint for another 80,000 steps
  pretrained_checkpoint: results/Checkpoints/starvla_qwenoft_g1_dexhands_fridge_pick_grapes/final_model/pytorch_model.pt
  max_train_steps: 80000
  num_warmup_steps: 1000
  save_interval: 20000
  eval_interval: 20000
  learning_rate:
    base: 5.0e-06
    qwen_vl_interface: 5.0e-06
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
