run_id: starvla_qwenoft_g1_fridge5
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null  # infer from the authenticated W&B account
wandb_project: starVLA_unitree_g1_dexhands
is_debug: false
version_id: "0.21"

# Unitree G1 whole-body + dexterous hands on five fridge tasks
# (Apple / GraspLast / Onion / PickCoke / TakeCoke), QwenOFT framework:
# Qwen3-VL-4B-Instruct-Action backbone + action special tokens + MLP regression head (L1).
#
# Why QwenOFT rather than the GR00T flow-matching head: on the grapes benchmark the
# two were statistically indistinguishable in accuracy (paired bootstrap 95% CI over
# val windows included zero), while QwenOFT ran inference at 48.7 ms (20.6 Hz) versus
# 69.4 ms (14.4 Hz) and trained in 19.0 h versus 21.7 h. When accuracy ties, take the
# cheaper model.
#
# Why head (dims 0, 1) is trained here, unlike the earlier runs: the head joints move
# with roughly the same amplitude as the arm joints (std 0.11-0.35 rad, range +-1.0-1.4),
# so they are real signal, and the head aims the front camera - a drifting head command
# corrupts the model's own observations at deployment. Runs that masked the head reached
# a head MSE of 0.31-0.39, while stage1/stage2, which trained it, reached 0.062/0.066.
# Only the hand discrete mode selectors (dims 10, 36) stay out of the loss: they take
# values in {0, 1, 2, 3} and are a classification target, not an L1 regression one.
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 45
    state_dim: 0
    # 16 frames at 30 FPS is a 0.53 s chunk (the earlier 50 FPS runs covered 0.32 s).
    # Lower this to 10 if a 0.33 s horizon is wanted instead.
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    # Exclude only the hand discrete mode selectors (10, 36); head (0, 1) is trained.
    ignored_action_dims: [10, 36]

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets
    data_mix: g1_fridge5_train
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    # One H200 NVL (144 GB): maximize real samples per optimizer step.
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    # Input order is front_view, left_wrist_view, right_wrist_view. Split the
    # stereo front frame into head-left/head-right and preserve every view's
    # aspect ratio with padding. The model therefore receives four views.
    split_side_by_side_indices: [0]
    letterbox_images: true
    delete_pause_frame: false
    video_backend: torchvision_av
    # The five datasets differ in size (274 to 488 episodes), so balance them.
    balance_dataset_weights: true
    balance_trajectory_weights: false
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

trainer:
  is_resume: false
  # This mixture holds ~5.54M frames, about ten times the grapes mixture (533k).
  # 200k steps x batch 16 = 3.2M samples, roughly 0.6 epochs, ~46 h at 0.823 s/step.
  # Halve to 100000 for a ~23 h run if the schedule matters more than coverage.
  max_train_steps: 200000
  num_warmup_steps: 4000
  save_interval: 25000
  eval_interval: 25000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
